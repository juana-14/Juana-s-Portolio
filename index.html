<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juana Yogendra — Business Analyst</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Lora:wght@500;600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16233D;
    --ink-soft:#3C475C;
    --paper:#F7F7F4;
    --panel:#FFFFFF;
    --gold:#B8862E;
    --gold-soft:#F1E4CB;
    --teal:#2F6F6B;
    --teal-soft:#E4EFEE;
    --line:#DEDEDA;
    --muted:#68707D;
    --radius:2px;
    --maxw:1080px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:16px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  ::selection{background:var(--gold-soft);}
  a:focus-visible, button:focus-visible{
    outline:2px solid var(--gold);
    outline-offset:3px;
  }
  .wrap{
    max-width:var(--maxw);
    margin:0 auto;
    padding:0 28px;
  }
  .mono{font-family:'IBM Plex Mono', monospace;}
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--muted);
  }

  /* ---------- Table-header style nav ---------- */
  .colheader-nav{
    position:sticky;
    top:0;
    z-index:20;
    background:rgba(247,247,244,0.94);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  .colheader-nav .wrap{
    display:flex;
    align-items:center;
    justify-content:space-between;
    height:52px;
  }
  .colheader-nav .brand{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    font-weight:600;
    letter-spacing:0.02em;
  }
  .colheader-nav ul{
    list-style:none;
    display:flex;
    gap:26px;
    margin:0;
    padding:0;
  }
  .colheader-nav a{
    text-decoration:none;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--muted);
    padding:4px 0;
    border-bottom:1px solid transparent;
    transition:color .15s ease, border-color .15s ease;
  }
  .colheader-nav a:hover{ color:var(--ink); border-bottom-color:var(--gold); }
  @media (max-width:640px){
    .colheader-nav ul{ gap:14px; }
    .colheader-nav a{ font-size:10.5px; }
  }

  /* ---------- Hero ---------- */
  .hero{
    padding:64px 0 48px;
  }
  .hero-grid{
    display:grid;
    grid-template-columns:1.2fr 1fr;
    gap:48px;
    align-items:end;
  }
  @media (max-width:840px){
    .hero-grid{ grid-template-columns:1fr; }
  }
  .hero h1{
    font-family:'Lora', serif;
    font-weight:600;
    font-size:clamp(2.4rem, 5vw, 3.6rem);
    line-height:1.04;
    margin:10px 0 14px;
    letter-spacing:-0.01em;
  }
  .hero .role{
    font-family:'IBM Plex Mono', monospace;
    font-size:14px;
    color:var(--teal);
    letter-spacing:0.02em;
    margin-bottom:16px;
  }
  .hero p.pitch{
    max-width:52ch;
    color:var(--ink-soft);
    font-size:16.5px;
  }
  .hero-actions{
    margin-top:24px;
    display:flex;
    gap:14px;
    flex-wrap:wrap;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:10px 18px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    text-decoration:none;
    border-radius:var(--radius);
    border:1px solid var(--ink);
    transition:background .15s ease, color .15s ease;
  }
  .btn-primary{ background:var(--ink); color:var(--paper); }
  .btn-primary:hover{ background:var(--gold); border-color:var(--gold); color:var(--ink); }
  .btn-ghost{ border-color:var(--line); color:var(--ink-soft); }
  .btn-ghost:hover{ border-color:var(--ink); color:var(--ink); }

  /* KPI dashboard strip -- signature element */
  .kpi-panel{
    background:var(--panel);
    border:1px solid var(--line);
    padding:18px;
  }
  .kpi-panel .kpi-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
  }
  .kpi-panel .kpi-head .dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--teal);
    display:inline-block;
    margin-right:7px;
  }
  .kpi-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
  }
  .kpi-tile{
    background:var(--panel);
    padding:16px 14px;
  }
  .kpi-tile .num{
    font-family:'IBM Plex Mono', monospace;
    font-size:28px;
    font-weight:600;
    color:var(--gold);
    line-height:1;
  }
  .kpi-tile .lbl{
    margin-top:8px;
    font-size:12px;
    color:var(--muted);
    line-height:1.4;
  }

  /* ---------- Section shell ---------- */
  section{ padding:56px 0; border-top:1px solid var(--line); }
  .section-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:28px;
    gap:20px;
    flex-wrap:wrap;
  }
  .section-head h2{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:1.7rem;
    margin:0;
  }
  .section-index{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--muted);
    letter-spacing:0.06em;
  }

  /* ---------- About ---------- */
  #about .about-body{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:40px;
  }
  @media (max-width:760px){ #about .about-body{ grid-template-columns:1fr; } }
  #about p{ color:var(--ink-soft); max-width:62ch; }
  .fact-list{
    list-style:none;
    margin:0; padding:0;
    border-top:1px solid var(--line);
  }
  .fact-list li{
    display:flex;
    justify-content:space-between;
    gap:12px;
    padding:10px 0;
    border-bottom:1px solid var(--line);
    font-size:14px;
  }
  .fact-list .k{ color:var(--muted); font-family:'IBM Plex Mono', monospace; font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  .fact-list .v{ text-align:right; }

  /* ---------- Skills ---------- */
  .skills-grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:0;
    border-top:1px solid var(--line);
    border-left:1px solid var(--line);
  }
  @media (max-width:840px){ .skills-grid{ grid-template-columns:repeat(2, 1fr); } }
  @media (max-width:480px){ .skills-grid{ grid-template-columns:1fr; } }
  .skill-col{
    border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);
    padding:18px 18px 22px;
  }
  .skill-col h3{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--teal);
    margin:0 0 14px;
  }
  .skill-col ul{ list-style:none; margin:0; padding:0; }
  .skill-col li{
    font-size:14.5px;
    padding:6px 0;
    border-bottom:1px dashed var(--line);
    color:var(--ink-soft);
  }
  .skill-col li:last-child{ border-bottom:none; }
  .skill-col li strong{ color:var(--ink); font-weight:600; }

  /* ---------- Projects ---------- */
  .project{
    background:var(--panel);
    border:1px solid var(--line);
    margin-bottom:22px;
  }
  .project-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:16px;
    padding:20px 24px 16px;
    border-bottom:1px solid var(--line);
    flex-wrap:wrap;
  }
  .project-top h3{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:1.3rem;
    margin:0 0 6px;
  }
  .project-role{
    font-size:13px;
    color:var(--muted);
  }
  .tag-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    padding:5px 9px;
    border:1px solid var(--teal);
    color:var(--teal);
    background:var(--teal-soft);
    white-space:nowrap;
    border-radius:2px;
  }
  .project-body{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
  }
  @media (max-width:760px){ .project-body{ grid-template-columns:1fr; } }
  .field{
    padding:20px 24px;
    border-right:1px solid var(--line);
  }
  .project-body .field:last-child{ border-right:none; }
  @media (max-width:760px){
    .field{ border-right:none; border-bottom:1px solid var(--line); }
    .project-body .field:last-child{ border-bottom:none; }
  }
  .field .field-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--gold);
    margin-bottom:8px;
  }
  .field p{
    margin:0;
    font-size:14.5px;
    color:var(--ink-soft);
  }
  .impact-figure{
    font-family:'IBM Plex Mono', monospace;
    color:var(--ink);
    font-weight:600;
  }

  /* ---------- Background / timeline ---------- */
  .timeline{
    border-top:1px solid var(--line);
  }
  .tl-row{
    display:grid;
    grid-template-columns:150px 1fr;
    gap:20px;
    padding:18px 0;
    border-bottom:1px solid var(--line);
  }
  @media (max-width:600px){ .tl-row{ grid-template-columns:1fr; gap:6px; } }
  .tl-row .when{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    color:var(--muted);
  }
  .tl-row .what strong{ display:block; margin-bottom:4px; }
  .tl-row .what p{ margin:0; color:var(--ink-soft); font-size:14.5px; }

  /* ---------- Footer / contact ---------- */
  footer{
    padding:48px 0 60px;
